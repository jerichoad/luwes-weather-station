info:
  name: List Sensors
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/sensors?per_page=20"
  params:
    - name: per_page
      value: "20"
    - name: sensor_type
      value: temp_air
      disabled: true
    - name: installed
      value: "true"
      disabled: true
    - name: retired
      value: "false"
      disabled: true
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an("array");
        });

settings:
  encodeUrl: true
