info:
  name: Healthz
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/healthz"
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200 atau 503", function() {
          expect([200, 503]).to.include(res.status);
        });

        test("Ada status db dan redis", function() {
          expect(res.body.data).to.have.property("status");
          expect(res.body.data).to.have.property("db");
          expect(res.body.data).to.have.property("redis");
        });

settings:
  encodeUrl: true
