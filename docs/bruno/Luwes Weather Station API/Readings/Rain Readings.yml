info:
  name: Rain Readings
  type: http
  seq: 3

http:
  method: GET
  url: "{{apiUrl}}/readings?device_id={{deviceId}}&sensor_type=rain_counter&interval=1h&agg=sum"
  params:
    - name: device_id
      value: "{{deviceId}}"
    - name: sensor_type
      value: rain_counter
    - name: interval
      value: 1h
    - name: agg
      value: sum
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
