info:
  name: Query Readings
  type: http
  seq: 2

http:
  method: GET
  url: "{{apiUrl}}/readings?device_id={{deviceId}}&sensor_type=temp_air,humidity&interval=1h&agg=avg"
  params:
    - name: device_id
      value: "{{deviceId}}"
    - name: sensor_type
      value: temp_air,humidity
    - name: interval
      value: 1h
    - name: agg
      value: avg
    - name: from
      value: "2026-10-06T00:00:00Z"
      disabled: true
    - name: to
      value: "2026-10-07T00:00:00Z"
      disabled: true
    - name: include_flagged
      value: "false"
      disabled: true
    - name: cursor
      value: ""
      disabled: true
    - name: limit
      value: "500"
      disabled: true
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.timestamps).to.be.an("array");
          expect(res.body.data.series).to.be.an("array");
        });

settings:
  encodeUrl: true

docs:
  content: |-
    - `sensor_type`: daftar kode dipisah koma (maks 4).
    - `interval`: `raw|1m|1h|1d`. `agg`: `avg|min|max|sum` (`sum` hanya untuk channel counter).
    - Default range 24 jam terakhir. Titik > 2000 balik `422 RANGE_TOO_LARGE` + `suggested_interval`.
    - `cursor`: epoch ms (keyset pagination, ambil dari `meta.next_cursor`).
  type: text/markdown
