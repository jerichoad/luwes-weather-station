info:
  name: Uninstall Sensor
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{apiUrl}}/devices/{{deviceId}}/sensors/{{sensorId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "reason": "Dilepas untuk kalibrasi"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.have.property("removed_at");
        });

settings:
  encodeUrl: true

docs:
  content: |-
    Opsional: `removed_at` (date, harus > `installed_at`), `reason` (default `Dilepas`).
  type: text/markdown
