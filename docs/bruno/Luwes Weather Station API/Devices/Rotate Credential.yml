info:
  name: Rotate Credential
  type: http
  seq: 7

http:
  method: POST
  url: "{{apiUrl}}/devices/{{deviceId}}/credentials/rotate"
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar("deviceApiKey", res.body.data.api_key);
        }
    - type: tests
      code: |-
        test("Status 201", function() {
          expect(res.status).to.equal(201);
          expect(res.body.data.api_key).to.match(/^wsk_/);
        });

settings:
  encodeUrl: true

docs:
  content: |-
    Key lama tetap berlaku sampai `previous_keys_expire_at` (grace default 24 jam).
    Device `decommissioned` balik `403 DEVICE_DECOMMISSIONED`.
  type: text/markdown
