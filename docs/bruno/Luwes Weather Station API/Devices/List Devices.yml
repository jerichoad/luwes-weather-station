info:
  name: List Devices
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/devices?per_page=20"
  params:
    - name: per_page
      value: "20"
    - name: status
      value: active
      disabled: true
    - name: location_id
      value: "{{locationId}}"
      disabled: true
    - name: q
      value: GRT
      disabled: true
    - name: silent_minutes
      value: "30"
      disabled: true
    - name: connectivity
      value: online
      disabled: true
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an("array");
          expect(res.body.meta).to.have.property("total");
        });

settings:
  encodeUrl: true
